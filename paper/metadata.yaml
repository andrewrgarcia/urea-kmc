abstract: "Piana, Reyhani and Gale (Nature 438, 70; 2005) grew urea crystals in three-dimensional kinetic Monte Carlo simulations driven by site rates counted directly in molecular dynamics, and reproduced the needle shape of urea grown from water and the polar shape grown from methanol. The rates are published in the Supplementary Information; the model that uses them is described briefly. We wrote an independent implementation from the published papers alone and report three things. First, which of the two chain neighbors the rate tables call $A$ depends on whether a rate is read from the point of view of the central molecule or of the arriving one, a point the corresponding author confirmed. Read from the arriving molecule's point of view, the tables give saturation at 4.7\\,M (water) and 3.4\\,M (methanol), against the published 5\\,M and 4\\,M; read the other way, they give about twice that and no needle. The first reading reproduces the paper's morphological claims: a needle in water whose \\{110\\} faces do not grow, pointed methanol ends twisted by 90$^\\circ$, birth-and-spread growth of the methanol \\{110\\} face, a methanol shape less elongated than the water one, and steps on \\{110\\} that advance about twice as fast one way along $c$ as the other. Second, the published rates are additive in bond energies at equilibrium but not in kinetics, which is what measuring them buys over an energy-based model. Third, exact continuous-time kinetic Monte Carlo and the paper's 50-ps synchronous sweep give the same morphologies. Code and inputs are open."

